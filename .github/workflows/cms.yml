# Execution stays disabled until the operator records Blacksmith qualification.
# See https://github.com/spitzli/cloud/blob/main/tools/plugin-ci/BLACKSMITH.md; runner labels alone do not select a region.
name: Independent CMS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cms-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: vars.SPITZLI_BLACKSMITH_READY == 'true' && vars.SPITZLI_BLACKSMITH_REGION != '' && vars.SPITZLI_BLACKSMITH_BUILDER_READY == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    env:
      SPITZLI_OCI_BACKEND: blacksmith-buildx
      SPITZLI_BLACKSMITH_REGION: ${{ vars.SPITZLI_BLACKSMITH_REGION }}
    steps:
      - name: Require reviewed Blacksmith execution
        shell: bash
        env:
          QUALIFIED_BLACKSMITH_REGION: ${{ vars.SPITZLI_BLACKSMITH_REGION }}
        run: |
          set -euo pipefail
          case "${BLACKSMITH_REGION:-}" in us-east|us-west|eu-central|eu-west) ;; *) echo 'Recorded Blacksmith region required' >&2; exit 1 ;; esac
          test "$BLACKSMITH_REGION" = "$QUALIFIED_BLACKSMITH_REGION"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject unexpected existing BuildKit before provider setup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e buildkitd.toml
          python3 scripts/plugin-release/build_oci.py --before-blacksmith-setup
      - name: Set up the managed Blacksmith builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # reviewed v2
        with:
          cache-key: Dockerfile
          nofallback: true
          buildx-version: v0.23.0
          platforms: linux/amd64
      - name: Verify provider builder and keep generated configuration outside source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plugin-release/build_oci.py --assert-blacksmith-builder
          mv -- buildkitd.toml "$RUNNER_TEMP/blacksmith-buildkitd.toml"
      - name: Resolve source image identity
        shell: bash
        run: printf 'IMAGE_REPOSITORY=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Check, unit test and build both components on the qualified Blacksmith builder
        run: python3 scripts/plugin-release/build_oci.py --check < /dev/null
  release:
    needs: check
    if: vars.SPITZLI_BLACKSMITH_READY == 'true' && vars.SPITZLI_BLACKSMITH_REGION != '' && vars.SPITZLI_BLACKSMITH_BUILDER_READY == 'true' && (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: plugin-release
    permissions:
      contents: write
      packages: write
    env:
      SPITZLI_OCI_BACKEND: blacksmith-buildx
      SPITZLI_BLACKSMITH_REGION: ${{ vars.SPITZLI_BLACKSMITH_REGION }}
    steps:
      - name: Require reviewed Blacksmith execution
        shell: bash
        env:
          QUALIFIED_BLACKSMITH_REGION: ${{ vars.SPITZLI_BLACKSMITH_REGION }}
        run: |
          set -euo pipefail
          case "${BLACKSMITH_REGION:-}" in us-east|us-west|eu-central|eu-west) ;; *) echo 'Recorded Blacksmith region required' >&2; exit 1 ;; esac
          test "$BLACKSMITH_REGION" = "$QUALIFIED_BLACKSMITH_REGION"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Reject unexpected existing BuildKit before provider setup
        shell: bash
        run: |
          set -euo pipefail
          test ! -e buildkitd.toml
          python3 scripts/plugin-release/build_oci.py --before-blacksmith-setup
      - name: Set up the managed Blacksmith builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # reviewed v2
        with:
          cache-key: Dockerfile
          nofallback: true
          buildx-version: v0.23.0
          platforms: linux/amd64
      - name: Verify provider builder and keep generated configuration outside source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plugin-release/build_oci.py --assert-blacksmith-builder
          mv -- buildkitd.toml "$RUNNER_TEMP/blacksmith-buildkitd.toml"
      - name: Require exact source version and preinstalled Bun
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = 1.4.3
          bun --no-env-file -e 'const p=await Bun.file("package.json").json();if(process.env.GITHUB_REF_NAME!=="v"+p.version)throw Error("Tag/version mismatch")'
          printf 'IMAGE_REPOSITORY=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Push the plugin component with the actual source repository label
        id: plugin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPITZLI_PLUGIN_DOCKERFILE: extensions/managed-cms/Dockerfile
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | python3 scripts/plugin-release/build_oci.py
      - name: Push the separate per-project CMS instance component
        id: instance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPITZLI_PLUGIN_DOCKERFILE: apps/cms-instance/Dockerfile
        run: |
          set -euo pipefail
          export IMAGE_REPOSITORY="$IMAGE_REPOSITORY-instance"
          printf '%s' "$GH_TOKEN" | python3 scripts/plugin-release/build_oci.py
      - name: Install the locked TS-v1 manifest generator
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun --no-env-file run build:sdk
      - name: Prepare exact legacy-v1 manifest/descriptor and separate instance binding
        env:
          PLUGIN_IMAGE: ${{ steps.plugin.outputs.image }}
          INSTANCE_IMAGE: ${{ steps.instance.outputs.image }}
        run: bun --no-env-file scripts/finalize.mjs
      - name: Publish immutable build assets; registry publication remains pending
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite immutable assets.' >&2
            exit 1
          fi
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/tabularium.json release/managed-cms-universal.json release/cms-instance-image.json release/release-lock.json release/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes 'Independent TypeScript protocol-v1 CMS plugin and separate CMS instance images. Registry publication/signature admission remains pending; no customer activation was performed.' "${prerelease[@]}"
